# 毎朝7時（日本時間）に、お便りの「合図」を送る。
#
# 🚨 送るのは合図だけで、文章は入っていない。
#    どの文章を出すかは、受け取った端末が自分で決める。
#    → 送り手は生年月日も数字も持たない（仕様書「端末の外に、利用者の情報を持たない」）。
#
# 🚨 GitHub の定時実行は、**数時間**ずれることがある（旧記述の「数分〜数十分」は誤り）。
#    実測：12分・4時間18分・7時間50分、そして**走らない日もあった**。早まることはない。
name: 毎朝のお便り

# 🚨 2026-09-05、定時での送信を止めた。**送るのは Cloudflare Workers `morning-letter`。**
#    止めてよいと決めた根拠：8/31〜9/4 の5日間、Cloudflare 側が
#    **毎日 7:00:36〜7:01:06（日本時間）** に送っていた（`morning_sends` の記録）。
#    それ以前の GitHub 側は 8:39・12:31 と、ばらばらだった。
#    （文書の決めごと：「翌朝、何時に届いたかを見る。7時ちょうどなら GitHub 側を止める」）
#
# 🚨 消さずに残してある。**Cloudflare が動かない日の逃げ道。**
#    Actions タブ →「Run workflow」で、手で送れる。合言葉は GitHub Secrets に入ったまま。
#    ⚠️ 戻すときは、下の `schedule:` の頭の `#` を外すだけ。

on:
  # schedule:
    # 22:00 UTC ＝ 翌日の 07:00（日本時間）
    #
    # 🚨 GitHub の定時実行は、数時間ずれることがある（実測：12分・4時間18分・7時間50分、
    #    そして走らなかった日もある）。1回しか掛けていないと、その日は届かない。
    #    → 朝7時から約1時間の間に5回かけ、**先に着いた1回だけが送る**。
    #      二重に送らないための札は置き場（Supabase）が持っている。
    #    ⚠️ 7時より前の時刻を足さないこと。GitHub は遅れることはあっても早まらないが、
    #       早い時刻を入れると、その回が時間どおり動いたときに朝7時前に届いてしまう。
    #    ⚠️ これは応急処置。時刻を保証するには、別の送り手へ移すしかない。
  #   - cron: "0 22 * * *"
  #   - cron: "12 22 * * *"
  #   - cron: "27 22 * * *"
  #   - cron: "43 22 * * *"
  #   - cron: "8 23 * * *"
  # 手で試せるようにしておく（Actions タブ →「Run workflow」）。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "送らずに、宛先の数だけ数える"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 依存はこの1つだけ。package.json を置かず、その場で入れる。
      - run: npm install --no-save web-push@3

      - name: 送る
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # 宛先の置き場。この3つが入っていれば、合言葉の手渡しは要らない。
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PUSH_PASS: ${{ secrets.PUSH_PASS }}
          # 置き場を使わない場合の手渡し用（どちらか一方でよい）。
          SUBSCRIPTIONS: ${{ secrets.SUBSCRIPTIONS }}
        run: node .github/scripts/send-morning.js ${{ inputs.dry_run && '--dry-run' || '' }}
