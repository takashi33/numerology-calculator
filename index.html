<title>数秘電卓</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://studio-lantern-numerology.pages.dev/">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #241a3d; color: #f3ecff; text-align: center;
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    padding: 24px; line-height: 1.9;
  }
  h1 { font-size: 22px; margin: 0 0 12px; color: #e8c877; }
  p { font-size: 16px; margin: 0 0 20px; }
  a { color: #241a3d; background: #e8c877; text-decoration: none;
      padding: 14px 24px; border-radius: 999px; font-weight: 700; display: inline-block; }
</style>
<div>
  <h1>数秘電卓は、引っ越しました</h1>
  <p>新しい住所へ移ります。<br>そのままお待ちください。</p>
  <p><a id="go" href="https://studio-lantern-numerology.pages.dev/">移らないときは、ここを押してください</a></p>
</div>
<script>
  // 古い住所に残っている読み込みの仕掛けを片づけてから移る。
  // 残したままだと、前の中身が表示され続けることがある。
  (async function () {
    // 🚨 この端末に残っているものを、新しい住所へ持って行く（Codexの指摘・2026-09-05）。
    //    手帳の記録は**ここにしか無い。**住所が変わると読めなくなり、戻せない。
    //    ⚠️ 送り先は「#」の後ろに載せる。**「#」から後ろは、置き場へは送られない。**
    //    ⚠️ 役（管理者）と発行の合言葉は持って行かない。持たせると、番号を知らなくても入れてしまう。
    let hikitsugi = "";
    try {
      const MOTTE_IKANAI = ["numerology-gate-role", "numerology-mint-pass"];
      const nimotsu = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || k.indexOf("numerology-") !== 0) continue;
        if (MOTTE_IKANAI.indexOf(k) >= 0) continue;
        nimotsu[k] = localStorage.getItem(k);
      }
      if (Object.keys(nimotsu).length) {
        const moji = btoa(unescape(encodeURIComponent(JSON.stringify(nimotsu))));
        // 長すぎると住所に載らない。載らないくらい多い場合は、あきらめて先へ進む。
        if (moji.length < 900000) hikitsugi = "#hikitsugi=" + moji;
      }
    } catch (err) {
      // 持って行けなくても、移ることを優先する。
    }

    // 手で押すほうのリンクにも、付いてきたものをそのまま足しておく。
    try {
      const go = document.getElementById("go");
      if (go) go.href = "https://studio-lantern-numerology.pages.dev/" + location.search + (hikitsugi || location.hash);
    } catch (err) { /* 押せなくなるより、そのままのほうがよい */ }
    try {
      if (navigator.serviceWorker) {
        const rs = await navigator.serviceWorker.getRegistrations();
        for (const r of rs) await r.unregister();
      }
      if (window.caches) {
        const ks = await caches.keys();
        for (const k of ks) await caches.delete(k);
      }
    } catch (err) {
      // 片づけられなくても、移ることを優先する。
    }
    // 🚨 `?t=`（お客様の一度きりのリンク）や `?a=`（依頼者の入り口）を落とさない。
    //    落とすと、お渡し済みのリンクで開けなくなる。
    location.replace("https://studio-lantern-numerology.pages.dev/" + location.search + (hikitsugi || location.hash));
  })();
</script>
